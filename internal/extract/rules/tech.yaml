# Technology fingerprints. A rule matches when any pattern matches.
#   html:   case-sensitive substrings searched in the raw document
#   src:    regular expressions matched against <script src> and <link href>
#   meta:   meta name -> regular expression for its content
#   header: response header -> regular expression for its value
- name: WordPress
  category: cms
  html: ["/wp-content/", "/wp-includes/"]
  meta: {generator: "(?i)^wordpress"}
- name: Drupal
  category: cms
  html: ["Drupal.settings", "/sites/default/files/"]
  meta: {generator: "(?i)^drupal"}
  header: {x-generator: "(?i)drupal", x-drupal-cache: ".+"}
- name: Joomla
  category: cms
  html: ["/media/jui/js/"]
  meta: {generator: "(?i)joomla"}
- name: TYPO3
  category: cms
  html: ["/typo3conf/", "/typo3temp/"]
  meta: {generator: "(?i)typo3"}
- name: Contentful
  category: cms
  html: ["images.ctfassets.net"]
- name: Ghost
  category: cms
  meta: {generator: "(?i)^ghost"}
- name: Webflow
  category: site-builder
  html: ["data-wf-site=", "assets.website-files.com"]
  meta: {generator: "(?i)webflow"}
- name: Wix
  category: site-builder
